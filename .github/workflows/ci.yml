name: Variable Manager CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-pricing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - name: PHP syntax
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Price matrix smoke tests
        run: php tests/pricing-smoke.php
      - name: Rule engine smoke tests
        run: php tests/rules-smoke.php
      - name: JavaScript syntax
        run: |
          node --check assets/admin.js
          node --check assets/storefront.js
      - name: Package staging installer
        run: |
          mkdir -p dist/woocommerce-variable-manager
          cp -R includes assets woocommerce-variable-manager.php README.md LICENSE dist/woocommerce-variable-manager/
          cd dist
          zip -qr ../woocommerce-variable-manager-0.3.0-beta.zip woocommerce-variable-manager
      - name: Upload staging installer
        uses: actions/upload-artifact@v4
        with:
          name: woocommerce-variable-manager-0.3.0-beta-staging
          path: woocommerce-variable-manager-0.3.0-beta.zip
          retention-days: 7
